[package]
name = "pellikan"
version = "0.0.1"
description = "A local-first Bible study app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pellikan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite (with FTS5) into the app, so it never depends on the system's SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
